name: Build Mac Catalyst Artifact

on:
  workflow_dispatch:

jobs:
  build-mac-catalyst:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            host_arch: x86_64
            artifact_suffix: intel
          - runner: macos-latest
            host_arch: arm64
            artifact_suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: |
          set -euxo pipefail
          echo "Runner: ${{ matrix.runner }}"
          echo "Detected architecture: $(uname -m)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Patch React Native for Xcode 16 Catalyst
        run: |
          set -euxo pipefail
          TARGET_FILE="node_modules/react-native/ReactCommon/react/runtime/platform/ios/ReactCommon/RCTInstance.mm"
          if [ ! -f "$TARGET_FILE" ]; then
            echo "Expected file not found: $TARGET_FILE" >&2
            exit 1
          fi
          sed -i '' 's/isFatal:errorData\[@"isFatal"\]/isFatal:[errorData[@"isFatal"] boolValue]/g' "$TARGET_FILE"
          grep -n 'isFatal:' "$TARGET_FILE" | head -n 20 || true

      - name: Install CocoaPods
        run: |
          set -euxo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods -N
          fi
          pod --version
          pod install --project-directory=ios

      - name: Prepare build log
        run: |
          mkdir -p build
          : > build/xcodebuild.log

      - name: Build Mac Catalyst app (unsigned)
        run: |
          set -euxo pipefail
          xcodebuild \
            -workspace ios/BlueWallet.xcworkspace \
            -scheme BlueWallet \
            -configuration Release \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build/DerivedData \
            -skipUnavailableActions \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ARCHS=${{ matrix.host_arch }} \
            ONLY_ACTIVE_ARCH=YES \
            build | tee -a build/xcodebuild.log

      - name: Install Tor runtime (for bundled on/off toggle)
        run: |
          set -euxo pipefail
          brew install tor
          tor --version

      - name: Package app artifact
        run: |
          set -euxo pipefail
          mkdir -p build/artifact
          APP_PATH="$(find build/DerivedData/Build/Products -type d -name '*.app' | grep -E '/(Ishmael|BlueWallet)\.app$' | head -n 1 || true)"
          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find build/DerivedData/Build/Products -type d -name '*.app' | head -n 1 || true)"
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under DerivedData products." >&2
            find build/DerivedData/Build/Products -maxdepth 4 -print || true
            exit 1
          fi

          MACOS_DIR="$APP_PATH/Contents/MacOS"
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          RESOURCES_DIR="$APP_PATH/Contents/Resources"
          TOR_PREFIX="$(brew --prefix tor)"
          TOR_BIN="$TOR_PREFIX/bin/tor"
          mkdir -p "$MACOS_DIR" "$FRAMEWORKS_DIR" "$RESOURCES_DIR"

          cp "$TOR_BIN" "$MACOS_DIR/tor"
          chmod +x "$MACOS_DIR/tor"

          if [ -f "$TOR_PREFIX/share/tor/geoip" ]; then
            cp "$TOR_PREFIX/share/tor/geoip" "$RESOURCES_DIR/geoip"
          fi
          if [ -f "$TOR_PREFIX/share/tor/geoip6" ]; then
            cp "$TOR_PREFIX/share/tor/geoip6" "$RESOURCES_DIR/geoip6"
          fi

          # Copy Homebrew-linked dynamic libraries tor depends on and retarget paths into app bundle.
          changed=1
          while [ "$changed" -eq 1 ]; do
            changed=0
            for target in "$MACOS_DIR/tor" "$FRAMEWORKS_DIR"/*.dylib; do
              [ -e "$target" ] || continue
              while read -r dep; do
                case "$dep" in
                  /usr/local/*|/opt/homebrew/*)
                    lib_name="$(basename "$dep")"
                    bundled_lib="$FRAMEWORKS_DIR/$lib_name"
                    if [ ! -f "$bundled_lib" ]; then
                      cp "$dep" "$bundled_lib"
                      chmod +w "$bundled_lib" || true
                      install_name_tool -id "@executable_path/../Frameworks/$lib_name" "$bundled_lib" || true
                      changed=1
                    fi
                    install_name_tool -change "$dep" "@executable_path/../Frameworks/$lib_name" "$target" || true
                    ;;
                esac
              done < <(otool -L "$target" | awk 'NR>1 {print $1}')
            done
          done

          otool -L "$MACOS_DIR/tor" || true
          ZIP_PATH="build/artifact/Ishmael-mac-catalyst-app-${{ matrix.artifact_suffix }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Upload Mac Catalyst app zip
        uses: actions/upload-artifact@v4
        with:
          name: ishmael-mac-catalyst-app-${{ matrix.artifact_suffix }}
          path: build/artifact/Ishmael-mac-catalyst-app-${{ matrix.artifact_suffix }}.zip
          retention-days: 14

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ matrix.artifact_suffix }}
          path: build/xcodebuild.log
          retention-days: 14
